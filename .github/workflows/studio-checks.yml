name: Website & Studio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          for file in assets/site-v2.js assets/studio.js assets/studio-vector.js assets/studio-ai.js assets/studio-math.js assets/studio-strategy.js assets/studio-forecast.js; do
            node --check "$file"
          done
      - name: Run Studio unit and site structure tests
        run: node --test tests/studio-math.test.cjs
