name: Website & Studio checks
on:
  pull_request:
  push:
    branches: [main, feature/customer-first-studio-workspaces]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
      - name: Run Studio unit and site structure tests
        run: node --test tests/*.test.cjs
      - name: Validate sitemap XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML valid')"
