name: Build lightweight wildlife editor sample
on:
  push:
    branches:
      - feature/wildlife-production-and-engineering-proof
    paths:
      - .github/workflows/production-proxy.yml
permissions:
  contents: write
jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Prepare small editing sample from original
        run: |
          set -euo pipefail
          mkdir -p assets/production
          ffmpeg -hide_banner -loglevel error -y -i listpull_production_before_and_after_editing.mp4 -vf "scale=720:-2" \
            -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p -movflags +faststart \
            -c:a aac -b:a 96k assets/production/fox-cubs-editor-sample.mp4
          ffprobe -v error -show_entries format=size,duration:stream=codec_name,width,height -of default=noprint_wrappers=1 assets/production/fox-cubs-editor-sample.mp4
      - name: Commit optimized demo asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production/fox-cubs-editor-sample.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized wildlife editing sample [skip ci]"
            git push origin HEAD:feature/wildlife-production-and-engineering-proof
          fi
