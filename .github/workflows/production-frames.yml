name: Extract real wildlife production stills
on:
  push:
    branches:
      - feature/wildlife-production-and-engineering-proof
    paths:
      - .github/workflows/production-frames.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate frames from original ListPull edit
        shell: bash
        run: |
          set -euo pipefail
          source="listpull_production_before_and_after_editing.mp4"
          mkdir -p assets/production
          # One frame from the unedited opening, one from the finished treatment.
          ffmpeg -hide_banner -loglevel error -y -ss 1.0 -i "$source" -frames:v 1 -vf "scale=810:-2" -c:v libwebp -quality 82 assets/production/fox-cubs-before.webp
          ffmpeg -hide_banner -loglevel error -y -ss 4.4 -i "$source" -frames:v 1 -vf "scale=810:-2" -c:v libwebp -quality 82 assets/production/fox-cubs-after.webp
          # Social sharing still: both actual source frames, left/right, no re-created imagery.
          ffmpeg -hide_banner -loglevel error -y \
            -i assets/production/fox-cubs-before.webp \
            -i assets/production/fox-cubs-after.webp \
            -filter_complex "[0:v]scale=600:675:force_original_aspect_ratio=increase,crop=600:675,drawtext=text=BEFORE:fontcolor=white:fontsize=34:box=1:boxcolor=black@0.6:boxborderw=14:x=26:y=26[left];[1:v]scale=600:675:force_original_aspect_ratio=increase,crop=600:675,drawtext=text=AFTER:fontcolor=white:fontsize=34:box=1:boxcolor=black@0.6:boxborderw=14:x=26:y=26[right];[left][right]hstack=inputs=2[output]" \
            -map "[output]" -frames:v 1 -c:v libwebp -quality 80 assets/production/fox-cubs-before-after-social.webp
          file assets/production/*.webp
      - name: Commit original production stills
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production/fox-cubs-*.webp
          if ! git diff --staged --quiet; then
            git commit -m "Add real before-and-after stills from ListPull production video [skip ci]"
            git push origin HEAD:feature/wildlife-production-and-engineering-proof
          fi
