# Publish the processed Jekyll output so jekyll-redirect-from actually works.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Jekyll site (including wildlife redirects)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify all generated blog redirects
        run: node --test tests/jekyll-blog-redirects.test.cjs
      - name: Upload Jekyll output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')"
            if [ "$count" = "1" ]; then
              echo "Pages artifact is ready"
              exit 0
            fi
            echo "Waiting for Pages artifact (found $count)..."
            sleep 2
          done
          echo "::error::Pages artifact did not become available"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
